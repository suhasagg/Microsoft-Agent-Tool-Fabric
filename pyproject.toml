[project]
name="microsoft-agent-tool-fabric"
version="1.0.0"
requires-python=">=3.11"
dependencies=[
 "fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3",
 "pydantic-settings>=2.4,<3","httpx>=0.27,<1","redis>=5,<6",
 "PyJWT>=2.9,<3","prometheus-client>=0.20,<1","structlog>=24,<26"
]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<1","ruff>=0.6,<1"]
[tool.pytest.ini_options]
pythonpath=["."]
asyncio_mode="auto"
